<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="100%" stop-color="#050712"/>
    </linearGradient>
    
    <!-- Cyber AI Gradient 1 (Cyan to Blue) -->
    <linearGradient id="aiCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <!-- Cyber AI Gradient 2 (Purple to Pink) -->
    <linearGradient id="aiPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Internal Grid Gridline -->
  <path d="M60 16 L60 104 M16 60 L104 60" stroke="#00f2fe" stroke-opacity="0.08" stroke-dasharray="3,3" stroke-width="1.2"/>

  <!-- First 'S' Ribbon (Cyan Flow) -->
  <path d="M78 34 C64 26, 42 28, 38 42 C34 54, 52 58, 62 62 C74 66, 82 72, 80 84 C77 96, 58 98, 42 90" 
        fill="none" 
        stroke="url(#aiCyanGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Second Intertwined 'S' (Purple/Pink Flow) -->
  <path d="M42 40 C56 32, 76 34, 80 46 C84 58, 66 62, 56 66 C44 70, 36 76, 38 88 C41 100, 62 102, 78 94" 
        fill="none" 
        stroke="url(#aiPurpleGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-dasharray="1 11" 
        stroke-dashoffset="3"/>

  <!-- Center Quantum Nexus Node (Forward AI Sparkle) -->
  <circle cx="60" cy="60" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="2" fill="#ffffff"/>
  
  <!-- Corner Tech Sparks -->
  <circle cx="28" cy="28" r="1.8" fill="#00f2fe" opacity="0.6"/>
  <circle cx="92" cy="92" r="1.8" fill="#f72585" opacity="0.6"/>
</svg>
